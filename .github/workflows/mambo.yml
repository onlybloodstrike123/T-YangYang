name: Templar GKI 5.10 Stable

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: "Nama Kernel (Final)"
        required: true
        default: "T-YangYang-MamboSU"
        type: string

      release_status:
        description: "Status Rilis"
        required: true
        type: choice
        default: "RELEASE"
        options:
          - "RELEASE"
          - "BETA"

      force_clean:
        description: "Paksa Clean Build"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build Templar GKI 5.10 Stable
    runs-on: ubuntu-24.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      BUILD_CONFIG: build.config.gki.aarch64
      KERNELSU_REPO: https://github.com/RapliVx/KernelSU.git
      KERNEL_NAME: ${{ inputs.kernel_name }}
      RELEASE_STATUS: ${{ inputs.release_status }}
      OUT_DIR: ${{ github.workspace }}/out
      CONFIG_FRAGMENT: ${{ github.workspace }}/kernel-config/stable.config

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            pahole \
            python3 \
            python3-pip \
            rsync \
            unzip \
            zip \
            lz4 \
            clang \
            llvm \
            lld \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

          echo "========================================"
          echo "Compiler"
          echo "========================================"
          clang --version

          echo
          echo "========================================"
          echo "LLVM"
          echo "========================================"
          llvm-config --version

          echo
          echo "========================================"
          echo "LLD"
          echo "========================================"
          ld.lld --version

          echo
          echo "========================================"
          echo "AArch64 GCC"
          echo "========================================"
          aarch64-linux-gnu-gcc --version

      # ============================================================
      # CLEAN BUILD
      # ============================================================

      - name: Reset build
        if: ${{ inputs.force_clean }}
        shell: bash
        run: |
          set -eux

          echo "Performing clean build..."

          rm -rf out
          rm -rf kernel-config
          rm -rf .cache

          git clean -fdx -e .github

          echo "Clean build completed."

      # ============================================================
      # SOURCE CHECK
      # ============================================================

      - name: Check source
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Templar GKI 5.10 Stable"
          echo "========================================"

          echo "Kernel Name : ${KERNEL_NAME}"
          echo "Release     : ${RELEASE_STATUS}"
          echo "ARCH        : ${ARCH}"
          echo "BUILD_CONFIG: ${BUILD_CONFIG}"
          echo "OUT_DIR     : ${OUT_DIR}"

          echo
          echo "========================================"
          echo "Git"
          echo "========================================"

          git describe --always --dirty || true
          git rev-parse HEAD || true

          echo
          echo "========================================"
          echo "Top-level"
          echo "========================================"

          ls -lah

          echo
          echo "========================================"
          echo "Build configuration files"
          echo "========================================"

          find . \
            -maxdepth 5 \
            -type f \
            -name "build.config*" \
            -not -path "./.git/*" \
            -print | sort || true

      # ============================================================
      # KERNELSU
      # ============================================================

      - name: Setup RapliVx KernelSU
        shell: bash
        run: |
          set -eux

          echo "Setting up RapliVx KernelSU..."

          if [ -f "KernelSU/kernel/setup.sh" ]; then

            echo "KernelSU setup script already exists."

          else

            echo "Downloading KernelSU setup script..."

            mkdir -p KernelSU

            curl -LSs \
              "https://raw.githubusercontent.com/RapliVx/KernelSU/master/kernel/setup.sh" \
              | bash

          fi

          echo
          echo "========================================"
          echo "KernelSU directory"
          echo "========================================"

          ls -lah KernelSU || true

          if [ -d "KernelSU/.git" ]; then
            git -C KernelSU describe --tags --always || true
          fi

      # ============================================================
      # CONFIG FRAGMENT
      # ============================================================

      - name: Create stable config fragment
        shell: bash
        run: |
          set -e

          mkdir -p "$(dirname "${CONFIG_FRAGMENT}")"

          cat > "${CONFIG_FRAGMENT}" <<'EOF'
          CONFIG_HZ_500=y
          CONFIG_HZ=500
          # CONFIG_HZ_100 is not set
          # CONFIG_HZ_250 is not set
          # CONFIG_HZ_300 is not set
          # CONFIG_HZ_1000 is not set

          CONFIG_KSU=y
          CONFIG_KSU_SYSCALL_HOOK=y

          CONFIG_KPROBES=y
          CONFIG_KRETPROBES=y
          CONFIG_HAVE_SYSCALL_TRACEPOINTS=y

          CONFIG_LTO_CLANG=y
          CONFIG_LTO_CLANG_THIN=y
          # CONFIG_LTO_CLANG_FULL is not set
          EOF

          echo
          echo "========================================"
          echo "Stable config fragment"
          echo "========================================"

          cat "${CONFIG_FRAGMENT}"

      # ============================================================
      # LOCATE BUILD SYSTEM
      # ============================================================

      - name: Locate build system
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Build system detection"
          echo "========================================"

          echo
          echo "build.sh:"
          find . \
            -type f \
            -name "build.sh" \
            -not -path "./.git/*" \
            -print | sort || true

          echo
          echo "build_kernel.sh:"
          find . \
            -type f \
            -name "build_kernel.sh" \
            -not -path "./.git/*" \
            -print | sort || true

          echo
          echo "Makefile:"
          find . \
            -maxdepth 3 \
            -type f \
            -name "Makefile" \
            -not -path "./.git/*" \
            -print | sort || true

          echo
          echo "build.config:"
          find . \
            -maxdepth 5 \
            -type f \
            -name "build.config*" \
            -not -path "./.git/*" \
            -print | sort || true

      # ============================================================
      # BUILD KERNEL
      # ============================================================

      - name: Build Kernel
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Starting kernel build"
          echo "========================================"

          mkdir -p "${OUT_DIR}"

          export ARCH=arm64
          export SUBARCH=arm64

          export LLVM=1
          export LLVM_IAS=1

          export CC=clang
          export LD=ld.lld

          export PATH="/usr/bin:${PATH}"

          echo
          echo "========================================"
          echo "Compiler"
          echo "========================================"

          command -v clang
          clang --version

          echo
          echo "========================================"
          echo "Linker"
          echo "========================================"

          command -v ld.lld
          ld.lld --version

          echo
          echo "========================================"
          echo "Output directory"
          echo "========================================"

          mkdir -p "${OUT_DIR}"

          # ----------------------------------------------------------
          # Detect build script
          # ----------------------------------------------------------

          BUILD_SCRIPT=""

          if [ -f "./build/build.sh" ]; then

            BUILD_SCRIPT="./build/build.sh"

          elif [ -f "./build.sh" ]; then

            BUILD_SCRIPT="./build.sh"

          else

            BUILD_SCRIPT="$(
              find . \
                -type f \
                \( \
                  -name "build.sh" \
                  -o \
                  -name "build_kernel.sh" \
                \) \
                -not -path "./.git/*" \
                -print \
                | head -n 1 || true
            )"

          fi

          # ----------------------------------------------------------
          # Android build script
          # ----------------------------------------------------------

          if [ -n "${BUILD_SCRIPT}" ]; then

            echo
            echo "Build script detected:"
            echo "${BUILD_SCRIPT}"

            chmod +x "${BUILD_SCRIPT}"

            export OUT_DIR="${OUT_DIR}"
            export GKI_DEFCONFIG_FRAGMENT="${CONFIG_FRAGMENT}"
            export BUILD_CONFIG="${BUILD_CONFIG}"

            echo
            echo "Running build script..."

            if "${BUILD_SCRIPT}" "${BUILD_CONFIG}"; then

              echo "Build script completed successfully."

            else

              echo
              echo "Build script failed with positional BUILD_CONFIG."
              echo "Retrying using BUILD_CONFIG environment variable..."

              BUILD_CONFIG="${BUILD_CONFIG}" \
                OUT_DIR="${OUT_DIR}" \
                GKI_DEFCONFIG_FRAGMENT="${CONFIG_FRAGMENT}" \
                "${BUILD_SCRIPT}"

            fi

          # ----------------------------------------------------------
          # Standard Kbuild
          # ----------------------------------------------------------

          else

            echo
            echo "========================================"
            echo "No Android build.sh detected."
            echo "Using standard Kbuild."
            echo "========================================"

            if [ ! -f "Makefile" ]; then

              echo "ERROR: Kernel Makefile not found."
              echo
              echo "Current directory:"
              pwd

              echo
              echo "Directory contents:"
              ls -lah

              exit 1

            fi

            echo
            echo "========================================"
            echo "Generating kernel configuration"
            echo "========================================"

            if make \
              O="${OUT_DIR}" \
              ARCH=arm64 \
              LLVM=1 \
              LLVM_IAS=1 \
              gki_defconfig; then

              echo "gki_defconfig generated."

            elif make \
              O="${OUT_DIR}" \
              ARCH=arm64 \
              LLVM=1 \
              LLVM_IAS=1 \
              defconfig; then

              echo "defconfig generated."

            else

              echo "ERROR: Unable to generate kernel defconfig."
              exit 1

            fi

            # --------------------------------------------------------
            # Merge config fragment
            # --------------------------------------------------------

            if [ -f "scripts/kconfig/merge_config.sh" ]; then

              chmod +x scripts/kconfig/merge_config.sh

              echo
              echo "Merging stable configuration..."

              scripts/kconfig/merge_config.sh \
                -O "${OUT_DIR}" \
                "${OUT_DIR}/.config" \
                "${CONFIG_FRAGMENT}"

            else

              echo
              echo "WARNING: merge_config.sh unavailable."
              echo "Appending config fragment manually..."

              cat "${CONFIG_FRAGMENT}" >> \
                "${OUT_DIR}/.config"

            fi

            # --------------------------------------------------------
            # Refresh config
            # --------------------------------------------------------

            echo
            echo "Refreshing configuration..."

            make \
              O="${OUT_DIR}" \
              ARCH=arm64 \
              LLVM=1 \
              LLVM_IAS=1 \
              olddefconfig

            # --------------------------------------------------------
            # Build
            # --------------------------------------------------------

            echo
            echo "========================================"
            echo "Building Image"
            echo "========================================"

            make \
              -j"$(nproc)" \
              O="${OUT_DIR}" \
              ARCH=arm64 \
              LLVM=1 \
              LLVM_IAS=1 \
              Image

          fi

          echo
          echo "========================================"
          echo "Build process finished"
          echo "========================================"

          echo "Output directory:"
          ls -lah "${OUT_DIR}" || true

      # ============================================================
      # VERIFY CONFIG
      # ============================================================

      - name: Verify kernel configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Verifying kernel configuration"
          echo "========================================"

          CONFIG_FILE=""

          if [ -f "${OUT_DIR}/.config" ]; then

            CONFIG_FILE="${OUT_DIR}/.config"

          else

            CONFIG_FILE="$(
              find . \
                -type f \
                -name ".config" \
                -not -path "./.git/*" \
                | head -n 1 || true
            )"

          fi

          if [ -z "${CONFIG_FILE}" ]; then

            echo "ERROR: No .config found."

            echo
            echo "Output directory:"
            ls -lah "${OUT_DIR}" || true

            exit 1

          fi

          echo "Using config:"
          echo "${CONFIG_FILE}"

          echo
          echo "========================================"
          echo "HZ"
          echo "========================================"

          grep -E \
            '^(CONFIG_HZ=|CONFIG_HZ_100=|CONFIG_HZ_250=|CONFIG_HZ_300=|CONFIG_HZ_500=|CONFIG_HZ_1000=)' \
            "${CONFIG_FILE}" || true

          echo
          echo "========================================"
          echo "KernelSU"
          echo "========================================"

          grep -E \
            '^CONFIG_KSU' \
            "${CONFIG_FILE}" || true

          echo
          echo "========================================"
          echo "KPROBES"
          echo "========================================"

          grep -E \
            '^CONFIG_KPROBES|^CONFIG_KRETPROBES|^CONFIG_HAVE_SYSCALL_TRACEPOINTS' \
            "${CONFIG_FILE}" || true

          echo
          echo "========================================"
          echo "LTO"
          echo "========================================"

          grep -E \
            '^CONFIG_LTO' \
            "${CONFIG_FILE}" || true

          # ----------------------------------------------------------
          # Required options
          # ----------------------------------------------------------

          HZ_OK=0
          KSU_OK=0

          if grep -q '^CONFIG_HZ=500' "${CONFIG_FILE}"; then
            HZ_OK=1
          fi

          if grep -q '^CONFIG_HZ_500=y' "${CONFIG_FILE}"; then
            HZ_OK=1
          fi

          if grep -q '^CONFIG_KSU=y' "${CONFIG_FILE}"; then
            KSU_OK=1
          fi

          if [ "${HZ_OK}" -ne 1 ]; then

            echo
            echo "ERROR: HZ 500 configuration was not applied."
            exit 1

          fi

          if [ "${KSU_OK}" -ne 1 ]; then

            echo
            echo "ERROR: KernelSU configuration was not applied."
            exit 1

          fi

          echo
          echo "========================================"
          echo "Configuration verification PASSED"
          echo "========================================"

      # ============================================================
      # COLLECT ARTIFACTS
      # ============================================================

      - name: Collect kernel artifacts
        shell: bash
        run: |
          set -e

          mkdir -p artifacts

          echo "========================================"
          echo "Searching kernel images"
          echo "========================================"

          echo
          echo "Image files:"

          find . \
            -type f \
            \( \
              -name "Image" \
              -o \
              -name "Image.gz" \
              -o \
              -name "Image.lz4" \
            \) \
            -not -path "./.git/*" \
            -not -path "./artifacts/*" \
            -print | sort || true

          echo
          echo "vmlinux:"

          find . \
            -type f \
            -name "vmlinux" \
            -not -path "./.git/*" \
            -not -path "./artifacts/*" \
            -print | sort || true

          # ----------------------------------------------------------
          # Find Image.lz4
          # ----------------------------------------------------------

          IMAGE_LZ4="$(
            find . \
              -type f \
              -name "Image.lz4" \
              -not -path "./.git/*" \
              -not -path "./artifacts/*" \
              | head -n 1 || true
          )"

          # ----------------------------------------------------------
          # Find raw Image
          # ----------------------------------------------------------

          IMAGE_RAW="$(
            find . \
              -type f \
              -name "Image" \
              -not -path "./.git/*" \
              -not -path "./artifacts/*" \
              | head -n 1 || true
          )"

          # ----------------------------------------------------------
          # Compress Image -> Image.lz4
          # ----------------------------------------------------------

          if [ -z "${IMAGE_LZ4}" ] && [ -n "${IMAGE_RAW}" ]; then

            echo
            echo "Image.lz4 not found."
            echo "Compressing Image using LZ4..."

            lz4 -f \
              "${IMAGE_RAW}" \
              "${OUT_DIR}/Image.lz4"

            IMAGE_LZ4="${OUT_DIR}/Image.lz4"

          fi

          # ----------------------------------------------------------
          # Validate Image.lz4
          # ----------------------------------------------------------

          if [ -z "${IMAGE_LZ4}" ]; then

            echo
            echo "ERROR: Image.lz4 could not be found or generated."

            echo
            echo "Output directory:"
            ls -lah "${OUT_DIR}" || true

            exit 1

          fi

          echo
          echo "Using Image.lz4:"
          echo "${IMAGE_LZ4}"

          # ----------------------------------------------------------
          # Copy Image.lz4
          # ----------------------------------------------------------

          cp \
            "${IMAGE_LZ4}" \
            "artifacts/${KERNEL_NAME}-${RELEASE_STATUS}-Image.lz4"

          # ----------------------------------------------------------
          # Copy raw Image
          # ----------------------------------------------------------

          if [ -n "${IMAGE_RAW}" ]; then

            cp \
              "${IMAGE_RAW}" \
              "artifacts/${KERNEL_NAME}-${RELEASE_STATUS}-Image"

          fi

          # ----------------------------------------------------------
          # Find vmlinux
          # ----------------------------------------------------------

          VMLINUX="$(
            find . \
              -type f \
              -name "vmlinux" \
              -not -path "./.git/*" \
              -not -path "./artifacts/*" \
              | head -n 1 || true
          )"

          if [ -n "${VMLINUX}" ]; then

            cp \
              "${VMLINUX}" \
              "artifacts/${KERNEL_NAME}-${RELEASE_STATUS}-vmlinux"

          fi

          echo
          echo "========================================"
          echo "Kernel artifacts"
          echo "========================================"

          ls -lh artifacts/

      # ============================================================
      # ANYKERNEL3
      # ============================================================

      - name: Clone AnyKernel3
        shell: bash
        run: |
          set -e

          rm -rf AnyKernel3

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3

      # ============================================================
      # PREPARE ANYKERNEL3
      # ============================================================

      - name: Prepare AnyKernel3
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Preparing AnyKernel3"
          echo "========================================"

          rm -rf AnyKernel3/.git
          rm -rf AnyKernel3/patch
          rm -rf AnyKernel3/ramdisk

          cp \
            "artifacts/${KERNEL_NAME}-${RELEASE_STATUS}-Image.lz4" \
            AnyKernel3/Image.lz4

          cat > AnyKernel3/anykernel.sh <<EOF
          properties() {
            kernel.string="${KERNEL_NAME} ${RELEASE_STATUS}"
            do.devicecheck=0
            do.modules=0
            do.systemless=1
            do.cleanup=1
            do.cleanuponabort=0
          }

          block=auto;
          is_slot_device=auto;
          ramdisk_compression=auto;

          . tools/ak3-core.sh;

          dump_boot;
          split_boot;
          flash_boot;
          flash_dtbo;
          EOF

          chmod +x AnyKernel3/anykernel.sh

          echo
          echo "========================================"
          echo "AnyKernel3 contents"
          echo "========================================"

          ls -lah AnyKernel3

      # ============================================================
      # CREATE ZIP
      # ============================================================

      - name: Create AnyKernel3 ZIP
        shell: bash
        run: |
          set -e

          cd AnyKernel3

          zip -r9 \
            "../artifacts/${KERNEL_NAME}-${RELEASE_STATUS}-HZ500-AnyKernel3.zip" \
            . \
            -x "*.git*" \
            -x "README.md"

          cd ..

          echo
          echo "========================================"
          echo "AnyKernel3 ZIP"
          echo "========================================"

          ls -lh \
            "artifacts/${KERNEL_NAME}-${RELEASE_STATUS}-HZ500-AnyKernel3.zip"

      # ============================================================
      # FINAL CHECK
      # ============================================================

      - name: Final artifact check
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "FINAL ARTIFACTS"
          echo "========================================"

          ls -lah artifacts/

          ZIP="artifacts/${KERNEL_NAME}-${RELEASE_STATUS}-HZ500-AnyKernel3.zip"

          if [ ! -f "${ZIP}" ]; then

            echo "ERROR: AnyKernel3 ZIP missing!"
            exit 1

          fi

          if [ ! -s "${ZIP}" ]; then

            echo "ERROR: AnyKernel3 ZIP is empty!"
            exit 1

          fi

          echo
          echo "AnyKernel3 ZIP successfully created:"
          echo "${ZIP}"

          echo
          echo "========================================"
          echo "BUILD COMPLETED SUCCESSFULLY"
          echo "========================================"

      # ============================================================
      # UPLOAD ANYKERNEL3
      # ============================================================

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.kernel_name }}-${{ inputs.release_status }}-AnyKernel3
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # UPLOAD ALL KERNEL ARTIFACTS
      # ============================================================

      - name: Upload stable kernel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.kernel_name }}-${{ inputs.release_status }}-HZ500
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
