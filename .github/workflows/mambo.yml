name: Templar GKI 5.10 Stable

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: 'Nama Kernel (Final)'
        required: true
        default: 'T-YangYang-MamboSU'
        type: string

      release_status:
        description: 'Status Rilis'
        required: true
        type: choice
        default: 'RELEASE'
        options:
          - 'RELEASE'
          - 'BETA'

      force_clean:
        description: 'Paksa Clean Build'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build Templar GKI 5.10 Stable
    runs-on: ubuntu-24.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      BUILD_CONFIG: build.config.gki.aarch64
      KERNELSU_REPO: https://github.com/RapliVx/KernelSU.git
      KERNEL_NAME: ${{ inputs.kernel_name }}
      RELEASE_STATUS: ${{ inputs.release_status }}
      OUT_DIR: ${{ github.workspace }}/out
      CONFIG_FRAGMENT: ${{ github.workspace }}/kernel-config/stable.config

    steps:
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive


      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            pahole \
            python3 \
            python3-pip \
            rsync \
            unzip \
            zip \
            lz4 \
            clang \
            llvm \
            lld \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

          echo "Clang:"
          clang --version

          echo
          echo "LLVM:"
          llvm-config --version

          echo
          echo "LLD:"
          ld.lld --version Reset build
        if: ${{ inputs.force_clean }}
        run: |
          set -eux

          rm -rf out
          rm -rf kernel-config
          rm -rf .cache

          git clean -fdx -e .github

      - name: Check source
        run: |
          set -e

          echo "Templar GKI 5.10 Stable"
          echo "Kernel Name : ${KERNEL_NAME}"
          echo "Release     : ${RELEASE_STATUS}"
          echo "ARCH        : ${ARCH}"
          echo "BUILD_CONFIG: ${BUILD_CONFIG}"

          echo
          echo "Git:"
          git describe --always --dirty || true
          git rev-parse HEAD || true

          echo
          echo "Top-level:"
          ls -lah

          echo
          echo "Build configuration files:"
          find . -maxdepth 4 \
            -type f \
            -name "build.config*" \
            -print | sort || true

      - name: Setup RapliVx KernelSU
        run: |
          set -eux

          if [ -f "KernelSU/kernel/setup.sh" ]; then
            echo "KernelSU setup script already exists."
          else
            curl -LSs \
              "https://raw.githubusercontent.com/RapliVx/KernelSU/master/kernel/setup.sh" \
              | bash
          fi

          echo
          echo "KernelSU directory:"
          ls -lah KernelSU || true

          git -C KernelSU describe --tags --always || true

      - name: Create stable config fragment
        run: |
          set -e

          mkdir -p kernel-config

          cat > "${CONFIG_FRAGMENT}" <<'EOF'
          CONFIG_HZ_500=y
          CONFIG_HZ=500
          # CONFIG_HZ_100 is not set
          # CONFIG_HZ_250 is not set
          # CONFIG_HZ_300 is not set
          CONFIG_KSU=y
          CONFIG_KSU_SYSCALL_HOOK=y
          CONFIG_KPROBES=y
          CONFIG_KRETPROBES=y
          CONFIG_HAVE_SYSCALL_TRACEPOINTS=y
          CONFIG_LTO_CLANG=y
          CONFIG_LTO_CLANG_THIN=y
          # CONFIG_LTO_CLANG_FULL is not set
          EOF

          cat "${CONFIG_FRAGMENT}"

      - name: Locate build system
        run: |
          set -e

          echo "Build system detection"

          echo
          echo "build.sh:"
          find . -type f -name "build.sh" \
            -not -path "./.git/*" \
            -print | sort || true

          echo
          echo "build_kernel.sh:"
          find . -type f -name "build_kernel.sh" \
            -not -path "./.git/*" \
            -print | sort || true

          echo
          echo "Makefile:"
          find . -maxdepth 3 -type f -name "Makefile" \
            -not -path "./.git/*" \
            -print | sort || true

          echo
          echo "build.config:"
          find . -maxdepth 4 -type f \
            -name "build.config*" \
            -not -path "./.git/*" \
            -print | sort || true

        - name: Build Kernel
        shell: bash
        run: |
          set -e

          echo "Starting kernel build"

          mkdir -p "${OUT_DIR}"

          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          export PATH="/usr/bin:${PATH}"

          export CC=clang
          export LD=ld.lld

          echo
          echo "Compiler:"
          command -v clang
          clang --version

          echo
          echo "Linker:"
          command -v ld.lld
          ld.lld --version

          BUILD_SCRIPT=""

          if [ -f "./build/build.sh" ]; then
            BUILD_SCRIPT="./build/build.sh"
          elif [ -f "./build.sh" ]; then
            BUILD_SCRIPT="./build.sh"
          else
            BUILD_SCRIPT="$(find . \
              -type f \
              \( -name "build.sh" -o -name "build_kernel.sh" \) \
              -not -path "./.git/*" \
              | head -n 1 || true)"
          fi

          if [ -n "${BUILD_SCRIPT}" ]; then

            echo "Build script detected:"
            echo "${BUILD_SCRIPT}"

            chmod +x "${BUILD_SCRIPT}"

            export OUT_DIR="${OUT_DIR}"
            export GKI_DEFCONFIG_FRAGMENT="${CONFIG_FRAGMENT}"

            "${BUILD_SCRIPT}" "${BUILD_CONFIG}"

          else

            echo "No Android build.sh detected."
            echo "Using standard Kbuild."

            if [ ! -f "Makefile" ]; then
              echo "ERROR: Kernel Makefile not found."
              exit 1
            fi

            echo
            echo "Generating kernel configuration..."

            if make \
              O="${OUT_DIR}" \
              ARCH=arm64 \
              LLVM=1 \
              LLVM_IAS=1 \
              gki_defconfig; then

              echo "gki_defconfig generated."

            elif make \
              O="${OUT_DIR}" \
              ARCH=arm64 \
              LLVM=1 \
              LLVM_IAS=1 \
              defconfig; then

              echo "defconfig generated."

            else
              echo "ERROR: Unable to generate kernel defconfig."
              exit 1
            fi

            if [ -x "scripts/kconfig/merge_config.sh" ]; then

              scripts/kconfig/merge_config.sh \
                -O "${OUT_DIR}" \
                "${OUT_DIR}/.config" \
                "${CONFIG_FRAGMENT}"

            elif [ -f "scripts/kconfig/merge_config.sh" ]; then

              chmod +x scripts/kconfig/merge_config.sh

              scripts/kconfig/merge_config.sh \
                -O "${OUT_DIR}" \
                "${OUT_DIR}/.config" \
                "${CONFIG_FRAGMENT}"

            else

              echo "merge_config.sh unavailable."

              cat "${CONFIG_FRAGMENT}" >> \
                "${OUT_DIR}/.config"

            fi

            echo
            echo "Refreshing configuration..."

            make \
              O="${OUT_DIR}" \
              ARCH=arm64 \
              LLVM=1 \
              LLVM_IAS=1 \
              olddefconfig

            echo
            echo "Building Image..."

            make \
              -j"$(nproc)" \
              O="${OUT_DIR}" \
              ARCH=arm64 \
              LLVM=1 \
              LLVM_IAS=1 \
              Image
          fi

      - name: Verify kernel configuration
        run: |
          set -e

          echo "Verifying kernel configuration"

          CONFIG_FILE=""

          if [ -f "${OUT_DIR}/.config" ]; then
            CONFIG_FILE="${OUT_DIR}/.config"
          else
            CONFIG_FILE="$(find . \
              -type f \
              -name ".config" \
              -not -path "./.git/*" \
              | head -n 1 || true)"
          fi

          if [ -z "${CONFIG_FILE}" ]; then
            echo "ERROR: No .config found."
            echo
            echo "Output directory:"
            ls -lah "${OUT_DIR}" || true
            exit 1
          fi

          echo "Using config:"
          echo "${CONFIG_FILE}"

          echo
          echo "HZ:"
          grep -E \
            '^(CONFIG_HZ=|CONFIG_HZ_100=|CONFIG_HZ_250=|CONFIG_HZ_300=|CONFIG_HZ_500=|CONFIG_HZ_1000=)' \
            "${CONFIG_FILE}" || true

          echo
          echo "KernelSU:"
          grep -E \
            '^CONFIG_KSU' \
            "${CONFIG_FILE}" || true

          echo
          echo "KPROBES:"
          grep -E \
            '^CONFIG_KPROBES|^CONFIG_KRETPROBES|^CONFIG_HAVE_SYSCALL_TRACEPOINTS' \
            "${CONFIG_FILE}" || true

          echo
          echo "LTO:"
          grep -E \
            '^CONFIG_LTO' \
            "${CONFIG_FILE}" || true

          echo
          echo "Checking required options"

          HZ_OK=0
          KSU_OK=0

          grep -q '^CONFIG_HZ_1000=y' "${CONFIG_FILE}" && HZ_OK=1 || true
          grep -q '^CONFIG_HZ=1000' "${CONFIG_FILE}" && HZ_OK=1 || true
          grep -q '^CONFIG_KSU=y' "${CONFIG_FILE}" && KSU_OK=1 || true

          if [ "${HZ_OK}" -ne 1 ]; then
            echo "ERROR: HZ 500 configuration was not applied."
            exit 1
          fi

          if [ "${KSU_OK}" -ne 1 ]; then
            echo "ERROR: KernelSU configuration was not applied."
            exit 1
          fi

          echo
          echo "Configuration verification PASSED."

      - name: Collect kernel artifacts
        shell: bash
        run: |
          set -e

          mkdir -p artifacts

          echo "Searching kernel images"

          echo
          echo "Image files:"
          find . \
            -type f \
            \( -name "Image" -o -name "Image.gz" -o -name "Image.lz4" \) \
            -not -path "./.git/*" \
            -print | sort || true

          echo
          echo "vmlinux:"
          find . \
            -type f \
            -name "vmlinux" \
            -not -path "./.git/*" \
            -print | sort || true

          IMAGE_LZ4="$(find . \
            -type f \
            -name "Image.lz4" \
            -not -path "./.git/*" \
            | head -n 1 || true)"

          IMAGE_RAW="$(find . \
            -type f \
            -name "Image" \
            -not -path "./.git/*" \
            | head -n 1 || true)"

          if [ -z "${IMAGE_LZ4}" ] && [ -n "${IMAGE_RAW}" ]; then
            echo
            echo "Image.lz4 not found."
            echo "Compressing Image using lz4..."

            lz4 -f \
              "${IMAGE_RAW}" \
              "${OUT_DIR}/Image.lz4"

            IMAGE_LZ4="${OUT_DIR}/Image.lz4"
          fi

          if [ -z "${IMAGE_LZ4}" ]; then
            echo
            echo "ERROR: Image.lz4 could not be found or generated."
            exit 1
          fi

          echo
          echo "Using Image.lz4:"
          echo "${IMAGE_LZ4}"

          cp \
            "${IMAGE_LZ4}" \
            "artifacts/${KERNEL_NAME}-${RELEASE_STATUS}-Image.lz4"

          if [ -n "${IMAGE_RAW}" ]; then
            cp \
              "${IMAGE_RAW}" \
              "artifacts/${KERNEL_NAME}-${RELEASE_STATUS}-Image"
          fi

          VMLINUX="$(find . \
            -type f \
            -name "vmlinux" \
            -not -path "./.git/*" \
            | head -n 1 || true)"

          if [ -n "${VMLINUX}" ]; then
            cp \
              "${VMLINUX}" \
              "artifacts/${KERNEL_NAME}-${RELEASE_STATUS}-vmlinux"
          fi

          echo
          echo "Kernel artifacts:"
          ls -lh artifacts/

      - name: Clone AnyKernel3
        run: |
          set -e

          rm -rf AnyKernel3

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3

      - name: Prepare AnyKernel3
        shell: bash
        run: |
          set -e

          echo "Preparing AnyKernel3"

          rm -rf AnyKernel3/.git
          rm -rf AnyKernel3/patch
          rm -rf AnyKernel3/ramdisk

          cp \
            "artifacts/${KERNEL_NAME}-${RELEASE_STATUS}-Image.lz4" \
            AnyKernel3/Image.lz4

          cat > AnyKernel3/anykernel.sh <<EOF
          properties() {
            kernel.string=${KERNEL_NAME} ${RELEASE_STATUS}
            do.devicecheck=0
            do.modules=0
            do.systemless=1
            do.cleanup=1
            do.cleanuponabort=0
          }

          block=auto;
          is_slot_device=auto;
          ramdisk_compression=auto;

          . tools/ak3-core.sh;

          dump_boot;
          split_boot;
          flash_boot;
          flash_dtbo;
          EOF

          chmod +x AnyKernel3/anykernel.sh

          echo
          echo "AnyKernel3 contents:"
          ls -lah AnyKernel3

      - name: Create AnyKernel3 ZIP
        run: |
          set -e

          cd AnyKernel3

          zip -r9 \
            "../artifacts/${KERNEL_NAME}-${RELEASE_STATUS}-HZ500-AnyKernel3.zip" \
            . \
            -x "*.git*" \
            -x "README.md"

          cd ..

          echo
          echo "AnyKernel3 ZIP:"
          ls -lh \
            "artifacts/${KERNEL_NAME}-${RELEASE_STATUS}-HZ500-AnyKernel3.zip"

      - name: Final artifact check
        run: |
          set -e

          echo "FINAL ARTIFACTS"

          ls -lah artifacts/

          ZIP="artifacts/${KERNEL_NAME}-${RELEASE_STATUS}-HZ500-AnyKernel3.zip"

          if [ ! -f "${ZIP}" ]; then
            echo "ERROR: AnyKernel3 ZIP missing!"
            exit 1
          fi

          if [ ! -s "${ZIP}" ]; then
            echo "ERROR: AnyKernel3 ZIP is empty!"
            exit 1
          fi

          echo
          echo "Build completed successfully."

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.kernel_name }}-${{ inputs.release_status }}-AnyKernel3
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload stable kernel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.kernel_name }}-${{ inputs.release_status }}-HZ500
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
